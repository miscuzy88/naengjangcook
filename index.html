<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="냉장쿡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>냉장쿡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 밝은 회색 바탕 위 흰 카드. 상단 큰 제목, 신선도 막대 목록, 하단 탭바 가운데 + 버튼, 재료 넣기는 아래에서 올라오는 창. */
:root {
  --bg: #F4F5F4;
  --card: #FFFFFF;
  --ink: #1B1F1D;
  --sub: #7A827E;
  --faint: #B4BAB7;
  --line: #ECEEED;
  --track: #EEF0EF;
  --green: #22C17A;
  --green-ink: #12985C;
  --green-soft: #E3F7EC;
  --amber: #F2A93B;
  --amber-soft: #FFF3DF;
  --red: #EE5A4A;
  --red-soft: #FDE8E5;
  --shadow: 0 1px 2px rgba(20, 30, 25, .04), 0 4px 16px rgba(20, 30, 25, .05);
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111413; --card: #1B201E; --ink: #EEF2F0; --sub: #9AA39F; --faint: #5E6763; --line: #262C29; --track: #2A302D;
    --green: #34D68B; --green-ink: #4BE19B; --green-soft: #18352A; --amber: #F5B656; --amber-soft: #3A2E17;
    --red: #F27566; --red-soft: #3E211D; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111413; --card: #1B201E; --ink: #EEF2F0; --sub: #9AA39F; --faint: #5E6763; --line: #262C29; --track: #2A302D;
  --green: #34D68B; --green-ink: #4BE19B; --green-soft: #18352A; --amber: #F5B656; --amber-soft: #3A2E17;
  --red: #F27566; --red-soft: #3E211D; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; }
.wrap { max-width: 520px; margin: 0 auto; padding-inline: 20px; padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
button, .btn { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-decoration: none; }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }
.hidden-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* 머리 */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.title { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; margin: 0; text-wrap: balance; }
.title.green { color: var(--green-ink); }
.title small { display: block; font-size: 22px; font-weight: 400; color: var(--sub); letter-spacing: -0.02em; }
.date { font-size: 13px; color: var(--sub); margin-top: 6px; }
.circle-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; flex: none; }

/* 검색, 요약 칸 */
.search { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 0 14px; box-shadow: var(--shadow); }
.search svg { color: var(--faint); flex: none; }
.search input { border: 0; background: transparent; padding: 13px 0; font: inherit; font-size: 16px; color: var(--ink); width: 100%; min-width: 0; outline: none; }
.search input::placeholder { color: var(--faint); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; text-align: left; border: 1.5px solid transparent; }
.tile span { font-size: 13px; color: var(--sub); }
.tile b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile.soon b { color: var(--amber); }
.tile.over b { color: var(--red); }
.tile[aria-pressed="true"] { border-color: currentColor; }
.tile.soon[aria-pressed="true"] { border-color: var(--amber); }
.tile.over[aria-pressed="true"] { border-color: var(--red); }

/* 칩 */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding-inline: 20px; padding-block: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; white-space: nowrap; padding: 8px 14px; border-radius: 999px; background: var(--card); font-size: 14px; color: var(--sub); box-shadow: var(--shadow); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.chip .n { font-size: 12px; opacity: .65; margin-left: 2px; font-variant-numeric: tabular-nums; }

/* 목록 머리 */
.listhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; white-space: nowrap; font-size: 14px; color: var(--sub); }
.listhead b { color: var(--green-ink); font-weight: 500; }
.seg { display: inline-flex; background: var(--track); border-radius: 10px; padding: 3px; }
.seg button { white-space: nowrap; padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); font-weight: 500; }
select.sort { border: 0; background: transparent; color: var(--sub); font: inherit; font-size: 14px; padding: 4px 0; }

/* 재료 카드 */
.items { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--card); border-radius: 18px; padding: 16px 16px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.item .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0; }
.item .nm { font-size: 17px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.item .tag { font-size: 12px; font-weight: 400; color: var(--sub); margin-left: 6px; }
.item .exp { font-size: 12px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .row2 { display: flex; align-items: center; gap: 12px; }
.bar { position: relative; flex: 1; height: 46px; }
.bar .track { position: absolute; left: 0; right: 0; top: 26px; height: 8px; border-radius: 4px; background: var(--track); }
.bar .fill { position: absolute; left: 0; top: 26px; height: 8px; border-radius: 4px; background: var(--green); }
.bar .fill::before { content: ""; position: absolute; left: 3px; top: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--card); opacity: .9; }
.badge { position: absolute; top: 10px; width: 42px; height: 42px; border-radius: 50%; background: var(--card); border: 1.5px solid var(--ink); display: grid; place-items: center; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; transform: translateX(-50%); }
.badge svg { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); }
.st-soon .fill { background: var(--amber); } .st-soon .badge { border-color: var(--amber); color: var(--amber); }
.st-over .badge { border-color: var(--red); color: var(--red); }
.st-none .fill { background: var(--faint); }
.done-btn { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--track); display: grid; place-items: center; color: var(--sub); }
.done-btn:hover { background: var(--green-soft); color: var(--green-ink); }
.sample-note { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--sub); background: var(--card); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
.link { color: var(--green-ink); font-weight: 500; font-size: 14px; }
.empty { background: var(--card); border-radius: 18px; padding: 36px 20px; text-align: center; color: var(--sub); font-size: 14px; box-shadow: var(--shadow); }

/* 요리 카드 */
.mine { display: flex; flex-direction: column; gap: 10px; }
.mine .head { display: flex; justify-content: space-between; align-items: center; }
.mine .head span { font-size: 15px; }
.minechips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { padding: 6px 11px; border-radius: 999px; background: var(--card); font-size: 13px; box-shadow: var(--shadow); }
.mchip.hot { background: var(--amber-soft); color: var(--amber); box-shadow: none; }
.recipes { display: flex; flex-direction: column; gap: 12px; }
.recipe { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); display: grid; grid-template-columns: 104px 1fr; overflow: hidden; }
.thumb { display: grid; place-items: center; font-size: 46px; min-height: 100%; }
.th-한식 { background: #FBEDE6; } .th-일식 { background: #F1ECF8; } .th-중식 { background: #FBE9E9; }
.th-양식 { background: #FFF4DE; } .th-분식 { background: #FDE9EF; } .th-동남아 { background: #E6F4EE; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .thumb { filter: saturate(.9); background: var(--track); } }
:root[data-theme="dark"] .thumb { background: var(--track); }
.rbody { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.best { font-size: 12px; color: var(--green-ink); font-weight: 500; }
.rname { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.meta { display: flex; gap: 12px; font-size: 12px; color: var(--sub); align-items: center; flex-wrap: wrap; }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.match { font-size: 13px; color: var(--ink); margin-top: 4px; display: flex; justify-content: space-between; }
.match em { font-style: normal; color: var(--sub); font-size: 12px; }
.mbar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.need { font-size: 12px; color: var(--sub); overflow-wrap: anywhere; }
.need b { font-weight: 500; color: var(--red); }
.ractions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.pill { text-decoration: none; display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--track); color: var(--ink); }
.pill.primary { background: var(--green); color: #fff; }

/* 장보기 */
.shop { display: flex; flex-direction: column; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.srow { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); min-width: 0; }
.srow:first-child { border-top: 0; }
.srow .nm { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.srow.done .nm { text-decoration: line-through; color: var(--faint); }
.check { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; flex: none; color: #fff; }
.check[aria-checked="true"] { background: var(--green); border-color: var(--green); }
.mini { text-decoration: none; font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--track); color: var(--ink); white-space: nowrap; }
.mini.green { background: var(--green-soft); color: var(--green-ink); }
.x { color: var(--faint); padding: 4px; }
.addline { display: flex; gap: 8px; }
.addline .search { flex: 1; }
.addline button { background: var(--ink); color: var(--card); border-radius: 14px; padding: 0 18px; font-weight: 500; flex: none; }
.fine { font-size: 12px; color: var(--sub); }

/* 더보기 */
.menu { display: flex; flex-direction: column; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.menu > * { padding: 16px; border-top: 1px solid var(--line); text-align: left; display: flex; justify-content: space-between; gap: 10px; }
.menu > *:first-child { border-top: 0; }
.danger { color: var(--red); }

/* 하단 탭바 */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
nav.tabs .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 12px; font-size: 11px; color: var(--faint); }
nav.tabs .tab[aria-selected="true"] { color: var(--ink); }
.fab { justify-self: center; width: 60px; height: 60px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; transform: translateY(-14px); box-shadow: 0 6px 16px rgba(34, 193, 122, .35); }

/* 재료 넣기 창 */
.sheet-bg { position: fixed; inset: 0; background: rgba(10, 15, 12, .35); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 24px 24px 0 0; max-height: 88%; overflow-y: auto; padding-inline: 20px; padding-block: 10px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet .inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--faint); margin: 0 auto 4px; opacity: .6; }
.sheet h2 { font-size: 22px; font-weight: 700; margin: 0; display: flex; justify-content: space-between; align-items: center; }
.qgrid { display: flex; flex-wrap: wrap; gap: 8px; }
.q { padding: 9px 14px; border-radius: 12px; background: var(--card); font-size: 14px; box-shadow: var(--shadow); }
.q.has { background: var(--green-soft); color: var(--green-ink); box-shadow: none; }
.form { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .full { grid-column: 1 / -1; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--sub); }
.form input, .form select { font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; border: 0; background: var(--track); color: var(--ink); width: 100%; min-width: 0; }
.bigbtn { grid-column: 1 / -1; background: var(--green); color: #fff; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 30; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  .fill, .mbar i { transition: width .3s ease; }
}
</style>
</head>
<body>


<div class="wrap">
  <!-- 냉장고 -->
  <section id="tab-fridge" class="wrap-inner" style="display:flex;flex-direction:column;gap:18px">
    <div class="top">
      <div><h1 class="title green">나의 냉장고</h1><div class="date" id="today"></div></div>
      <button class="circle-btn" data-go="more" aria-label="더보기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="sample-note" id="sampleNote" hidden><span>예시 재료가 들어 있어요</span><button class="link" id="clearSample">지우고 시작</button></div>
    <div class="tiles">
      <button class="tile soon" id="tileSoon" aria-pressed="false"><span>유통기한 임박</span><b id="nSoon">0</b></button>
      <button class="tile over" id="tileOver" aria-pressed="false"><span>유통기한 지남</span><b id="nOver">0</b></button>
    </div>
    <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="hidden-label">재료 검색</span><input id="q" type="search" placeholder="검색" autocomplete="off"></label>
    <div class="chips" id="catChips" role="group" aria-label="종류"></div>
    <div class="listhead">
      <span>품목 <b id="nItems">0</b> · <select class="sort" id="sort" aria-label="정렬"><option value="exp">유통기한 임박순</option><option value="new">최근 넣은 순</option><option value="name">이름순</option></select></span>
      <div class="seg" id="placeSeg" role="group" aria-label="보관 칸">
        <button data-p="전체" aria-pressed="true">전체</button><button data-p="냉장" aria-pressed="false">냉장</button><button data-p="냉동" aria-pressed="false">냉동</button><button data-p="실온" aria-pressed="false">실온</button>
      </div>
    </div>
    <div class="items" id="items"></div>
  </section>

  <!-- 요리 -->
  <section id="tab-cook" hidden style="flex-direction:column;gap:18px">
    <h1 class="title"><span id="nRecipes">0</span>가지 요리를<small>지금 바로 만들 수 있어요</small></h1>
    <div class="mine">
      <div class="head"><span>내 재료</span><button class="link" data-go="fridge">편집</button></div>
      <div class="minechips" id="mineChips"></div>
    </div>
    <div class="chips" id="cuisineChips" role="group" aria-label="요리 종류"></div>
    <div class="recipes" id="recipes"></div>
  </section>

  <!-- 장보기 -->
  <section id="tab-shop" hidden style="flex-direction:column;gap:18px">
    <h1 class="title">장보기<small id="shopSub">살 것 0개</small></h1>
    <div class="addline">
      <label class="search"><span class="hidden-label">사야 할 재료</span><input id="sName" placeholder="사야 할 재료" autocomplete="off"></label>
      <button id="sAdd">추가</button>
    </div>
    <div id="shopList"></div>
    <p class="fine">쿠팡·네이버쇼핑 검색으로 연결돼요. 나중에 제휴 링크로 바뀌면 냉장쿡이 일정 수수료를 받을 수 있고, 그때 이 안내도 함께 바뀝니다.</p>
  </section>

  <!-- 더보기 -->
  <section id="tab-more" hidden style="flex-direction:column;gap:18px">
    <h1 class="title">더보기<small>냉장쿡 v0.5</small></h1>
    <div class="menu">
      <div><span>재료 저장 위치</span><span class="fine">이 휴대폰에만 저장</span></div>
      <div><span>요리 수</span><span class="fine" id="recipeCount"></span></div>
      <button id="resetAll" class="danger">모든 재료와 장보기 지우기</button>
      <div id="resetConfirm" hidden><span>정말 지울까요?</span><span style="display:flex;gap:8px"><button class="mini" id="resetNo">취소</button><button class="mini danger" id="resetYes">지우기</button></span></div>
    </div>
    <p class="fine">재료 목록은 지금 쓰는 휴대폰 브라우저에만 저장돼요. 브라우저 기록을 지우면 함께 지워질 수 있어요.</p>
  </section>
</div>

<nav class="tabs" aria-label="메뉴">
  <div class="inner">
    <button class="tab" data-go="fridge" aria-selected="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5.5" y="2.5" width="13" height="19" rx="3"/><path d="M5.5 10h13M9 6v1.5M9 13v3"/></svg>냉장고</button>

const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const addDays = n => { const d = today(); d.setDate(d.getDate()+n); return iso(d); };
const daysLeft = s => s ? Math.round((new Date(s+"T00:00:00") - today()) / 86400000) : null;
const uid = () => Math.random().toString(36).slice(2,9);

function sample() {

function status(it) {
  const d = daysLeft(it.exp);
  if (d === null) return "none";
  if (d < 0) return "over";
  if (d <= 3) return "soon";
  return "ok";
}

let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1700); }

// ===== 요리 점수 =====
function owned() { const m = {}; state.items.forEach(it => { const k = norm(it.name); const d = daysLeft(it.exp); const v = d === null ? 999 : d; if (!(k in m) || v < m[k]) m[k] = v; }); return m; }
function scoreRecipes(all) {
  const own = owned();
  return RECIPES.map(r => {
    const have = r.i.filter(x => x in own), miss = r.i.filter(x => !(x in own));
    const hot = have.filter(x => own[x] <= 3), sMiss = r.s.filter(x => !(x in own));
    const ratio = have.length / r.i.length;
    return { ...r, have, miss, hot, sMiss, ratio, score: ratio * 100 + hot.length * 25 - miss.length * 5 - sMiss.length * 2 };
  }).filter(r => all || r.have.length > 0).sort((a, b) => b.score - a.score);
}

function renderFridge() {
  const d = new Date(); $("today").textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;

  $("nSoon").textContent = state.items.filter(it => status(it) === "soon").length;
  $("nOver").textContent = state.items.filter(it => status(it) === "over").length;
  $("tileSoon").setAttribute("aria-pressed", state.view === "soon");
  $("tileOver").setAttribute("aria-pressed", state.view === "over");
  document.querySelectorAll("#placeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === state.place));
  $("sort").value = state.sort;

  const cnt = c => state.items.filter(it => c === "전체" || catOf(it.name) === c).length;
  $("catChips").innerHTML = ["전체", ...CAT_NAMES].filter(c => c === "전체" || c === state.cat || cnt(c) > 0)
    .map(c => `<button class="chip" data-cat="${c}" aria-pressed="${c === state.cat}">${c}<span class="n">${cnt(c)}</span></button>`).join("");

  const q = norm($("q").value || "");
  let list = state.items.filter(it =>
    (state.place === "전체" || it.place === state.place) &&
    (state.cat === "전체" || catOf(it.name) === state.cat) &&
    (!state.view || status(it) === state.view) &&
    (!q || norm(it.name).includes(q) || it.name.includes(q)));
  const by = { exp: (a, b) => (daysLeft(a.exp) ?? 9999) - (daysLeft(b.exp) ?? 9999), new: (a, b) => (b.added || 0) - (a.added || 0), name: (a, b) => a.name.localeCompare(b.name, "ko") };
  list.sort(by[state.sort]);
  $("nItems").textContent = list.length;

  if (!list.length) {
    $("items").innerHTML = `<div class="empty">${state.items.length ? "조건에 맞는 재료가 없어요" : "냉장고가 비어 있어요<br>아래 <b>+</b> 버튼으로 재료를 넣어 보세요"}</div>`;
    return;
  }
  $("items").innerHTML = list.map(it => {
    const st = status(it), d = daysLeft(it.exp);
    const total = it.total || shelf(it.name)[1];
    const pct = d === null ? 100 : Math.max(0, Math.min(1, d / total)) * 100;
    const label = d === null ? "-" : d < 0 ? `${-d}일↑` : d === 0 ? "오늘" : `${d}일`;
    const leafC = st === "soon" ? "var(--amber)" : st === "over" ? "var(--red)" : "var(--green)";
    const pos = `calc(21px + (100% - 42px) * ${pct / 100})`;
    return `<article class="item st-${st}">
      <div class="row1"><span class="nm">${esc(it.name)}<span class="tag">${it.place}${it.sample ? " · 예시" : ""}</span></span>
        <span class="exp">${it.exp ? it.exp.replace(/-/g, ". ") : "기한 없음"}</span></div>
      <div class="row2">
        <div class="bar" aria-label="${esc(it.name)} 남은 기한 ${label}">
          <span class="track"></span><span class="fill" style="width:${pos}"></span>
          <span class="badge" style="left:${pos}">${st === "over" ? "" : LEAF(leafC)}${label}</span>
        </div>
        <button class="done-btn" data-use="${it.id}" aria-label="${esc(it.name)} 다 먹음">${ICON_CHECK}</button>
      </div>
    </article>`;
  }).join("");
}

  const mine = Object.entries(own).sort((a, b) => a[1] - b[1]).slice(0, 10);
  $("mineChips").innerHTML = mine.length ? mine.map(([n, d]) => `<span class="mchip ${d <= 3 ? "hot" : ""}">${esc(n)}</span>`).join("") + (Object.keys(own).length > 10 ? `<span class="mchip">+${Object.keys(own).length - 10}</span>` : "")
    : '<span class="fine">아직 재료가 없어요</span>';
  $("cuisineChips").innerHTML = CUISINES.map(c => `<button class="chip" data-cz="${c}" aria-pressed="${c === state.cuisine}">${c}</button>`).join("");
  const list = state.cuisine === "전체" ? all : scoreRecipes(true).filter(r => r.c === state.cuisine);
  $("recipes").innerHTML = list.length ? list.map((r, i) => {
    const [min, lv] = TIME[r.n] || [20, "보통"];
    const pct = Math.round(r.ratio * 100);
    const lack = [...r.miss, ...r.sMiss];
    return `<article class="recipe">
      <div class="thumb th-${r.c}" aria-hidden="true">${EMOJI[r.n] || CUISINE_EMOJI[r.c]}</div>
      <div class="rbody">
        ${i === 0 && pct >= 50 && state.cuisine === "전체" ? '<span class="best">가장 잘 맞아요</span>' : r.hot.length ? `<span class="best" style="color:var(--amber)">${r.hot.join("·")} 먼저 써요</span>` : `<span class="best" style="color:var(--sub)">${r.c}</span>`}
        <span class="rname">${r.n}</span>
        <div class="meta"><span>${ICON_CLOCK}${min}분</span><span>${ICON_HAT}${lv}</span></div>
        <div class="match"><span>${pct}% 일치</span><em>재료 ${r.have.length}/${r.i.length}</em></div>
        <div class="mbar"><i style="width:${pct}%"></i></div>
        ${lack.length ? `<div class="need">필요: ${r.miss.map(x => `<b>${x}</b>`).join(", ")}${r.miss.length && r.sMiss.length ? ", " : ""}${r.sMiss.join(", ")}${r.sMiss.length ? " (양념)" : ""}</div>` : ""}
        <div class="ractions">
          <a class="pill primary" href="${ytUrl(r.q)}" target="_blank" rel="noopener">${ICON_PLAY}영상 보기</a>
          ${lack.length ? `<button class="pill" data-addmiss="${r.n}">장보기 담기</button>` : ""}
        </div>
      </div>
    </article>`;
  }).join("") : '<div class="empty">재료를 넣으면 만들 수 있는 요리가 여기 나와요</div>';
}

function renderShop() {
  const left = state.shop.filter(s => !s.done).length;
  $("shopSub").textContent = `살 것 ${left}개`;
  const items = [...state.shop].sort((a, b) => a.done - b.done);
  $("shopList").innerHTML = items.length ? `<div class="shop">${items.map(s => `
    <div class="srow ${s.done ? "done" : ""}">
      <button class="check" role="checkbox" aria-checked="${!!s.done}" data-toggle="${s.id}" aria-label="${esc(s.name)} 샀음">${s.done ? ICON_CHECK : ""}</button>
      <span class="nm">${esc(s.name)}</span>
      ${s.done ? `<button class="mini green" data-tofridge="${s.id}">냉장고에 넣기</button>` : `
        <a class="mini" href="${coupangUrl(s.name)}" target="_blank" rel="noopener">쿠팡</a>
        <a class="mini green" href="${naverUrl(s.name)}" target="_blank" rel="noopener">산지직송</a>`}
      <button class="x" data-del="${s.id}" aria-label="${esc(s.name)} 지우기">${ICON_X}</button>
    </div>`).join("")}</div>` : '<div class="empty">요리 추천에서 부족한 재료를 담아 보세요</div>';
}

function renderMore() { $("recipeCount").textContent = `${RECIPES.length}가지 · 6개 나라`; }

function renderSheet() {
  $("addCats").innerHTML = CAT_NAMES.map(c => `<button class="chip" data-ac="${c}" aria-pressed="${c === state.addCat}">${c}</button>`).join("");
  const have = new Set(state.items.map(it => norm(it.name)));
  $("quick").innerHTML = CATS[state.addCat].map(n => `<button class="q ${have.has(norm(n)) ? "has" : ""}" data-quick="${n}">${n}</button>`).join("");
}

function renderTabs() {
  ["fridge","cook","shop","more"].forEach(t => { const el = $("tab-" + t); el.hidden = state.tab !== t; el.style.display = state.tab === t ? "flex" : ""; });
  document.querySelectorAll("nav .tab").forEach(b => b.setAttribute("aria-selected", b.dataset.go === state.tab));
}

function render() { renderTabs(); renderFridge(); renderCook(); renderShop(); renderMore(); if (!$("sheet").hidden) renderSheet(); save(); }

// ===== 동작 =====
function go(t) { state.tab = t; render(); window.scrollTo(0, 0); }
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

function addItem(name, place, exp) {
  name = name.trim(); if (!name) { toast("재료 이름을 적어 주세요"); return; }
  const d = exp ? daysLeft(exp) : null;
  state.items.push({ id: uid(), name, place, exp: exp || "", total: Math.max(1, d ?? shelf(name)[1]), added: Date.now() });
  render(); toast(`${name} 넣었어요`);
}
function openSheet() { $("sheet").hidden = false; $("sheetBg").hidden = false; renderSheet(); }
function closeSheet() { $("sheet").hidden = true; $("sheetBg").hidden = true; }
$("openAdd").addEventListener("click", openSheet);
$("closeAdd").addEventListener("click", closeSheet);
$("sheetBg").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("addCats").addEventListener("click", e => { const b = e.target.closest("[data-ac]"); if (b) { state.addCat = b.dataset.ac; renderSheet(); save(); } });
$("quick").addEventListener("click", e => {
  const b = e.target.closest("[data-quick]"); if (!b) return; const n = b.dataset.quick;
  if (isSauce(norm(n)) && state.items.some(it => norm(it.name) === norm(n))) { toast(`${n}은(는) 이미 있어요`); return; }
  const f = shelf(n); addItem(n, f[0], addDays(f[1]));
});
$("fName").addEventListener("input", () => { const k = norm($("fName").value); if (FOODS[k]) { $("fPlace").value = FOODS[k][0]; $("fDate").value = addDays(FOODS[k][1]); } });
$("addBtn").addEventListener("click", () => { addItem($("fName").value, $("fPlace").value, $("fDate").value); $("fName").value = ""; $("fDate").value = ""; });
$("fName").addEventListener("keydown", e => { if (e.key === "Enter") $("addBtn").click(); });

$("q").addEventListener("input", renderFridge);
$("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("placeSeg").addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) { state.place = b.dataset.p; render(); } });
$("catChips").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) { state.cat = b.dataset.cat; render(); } });
$("tileSoon").addEventListener("click", () => { state.view = state.view === "soon" ? "" : "soon"; render(); });
$("tileOver").addEventListener("click", () => { state.view = state.view === "over" ? "" : "over"; render(); });
$("items").addEventListener("click", e => {
  const b = e.target.closest("[data-use]"); if (!b) return;
  const it = state.items.find(x => x.id === b.dataset.use);
  state.items = state.items.filter(x => x.id !== it.id); render(); toast(`${it.name} 다 먹었어요`);
});
$("clearSample").addEventListener("click", () => { state.items = state.items.filter(x => !x.sample); state.shop = state.shop.filter(x => !x.sample); render(); toast("예시를 지웠어요"); });

$("cuisineChips").addEventListener("click", e => { const b = e.target.closest("[data-cz]"); if (b) { state.cuisine = b.dataset.cz; render(); } });
$("recipes").addEventListener("click", e => {
  const b = e.target.closest("[data-addmiss]"); if (!b) return;
  const r = scoreRecipes(true).find(x => x.n === b.dataset.addmiss); let c = 0;
  [...r.miss, ...r.sMiss].forEach(m => { if (!state.shop.some(s => norm(s.name) === m && !s.done)) { state.shop.push({ id: uid(), name: m, done: false }); c++; } });
  render(); toast(c ? `${c}개 장보기에 담았어요` : "이미 담겨 있어요");
});

$("sAdd").addEventListener("click", () => { const n = $("sName").value.trim(); if (!n) { toast("재료 이름을 적어 주세요"); return; } state.shop.push({ id: uid(), name: n, done: false }); $("sName").value = ""; render(); });
$("sName").addEventListener("keydown", e => { if (e.key === "Enter") $("sAdd").click(); });
$("shopList").addEventListener("click", e => {
  const t = e.target.closest("[data-toggle],[data-del],[data-tofridge]"); if (!t) return;
  if (t.dataset.toggle) { const s = state.shop.find(x => x.id === t.dataset.toggle); s.done = !s.done; }
  if (t.dataset.del) state.shop = state.shop.filter(x => x.id !== t.dataset.del);
  if (t.dataset.tofridge) {
    const s = state.shop.find(x => x.id === t.dataset.tofridge); const f = shelf(s.name);
    state.items.push({ id: uid(), name: s.name, place: f[0], exp: addDays(f[1]), total: f[1], added: Date.now() });
    state.shop = state.shop.filter(x => x.id !== s.id); toast(`${s.name} 냉장고에 넣었어요`);
  }
  render();
});

$("resetAll").addEventListener("click", () => { $("resetConfirm").hidden = false; });
$("resetNo").addEventListener("click", () => { $("resetConfirm").hidden = true; });
$("resetYes").addEventListener("click", () => { state.items = []; state.shop = []; $("resetConfirm").hidden = true; render(); toast("모두 지웠어요"); });

render();
</script>

<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
